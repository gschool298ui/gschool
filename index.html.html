<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G스쿨 교재 스토어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#161b33;--mu:#6b7190;--bd:#e2e5f0;--pr:#2a3fb8;--pt:#fff;--sale:#d92d3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1224;--sf:#181c36;--tx:#eceef9;--mu:#9aa0c4;--bd:#2a3058;--pr:#7d8dff;--pt:#0f1224;--sale:#ff6b76}}
:root[data-theme="dark"]{--bg:#0f1224;--sf:#181c36;--tx:#eceef9;--mu:#9aa0c4;--bd:#2a3058;--pr:#7d8dff;--pt:#0f1224;--sale:#ff6b76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-weight:900;font-size:26px;letter-spacing:-1px;color:var(--pr)}
.logo small{font-weight:500;font-size:12px;color:var(--mu);margin-left:8px;letter-spacing:0}
.cartbtn{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:999px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer}
.cartbtn b{color:var(--pr)}
nav{display:flex;gap:22px;padding:0 20px;background:var(--sf);border-bottom:1px solid var(--bd);overflow-x:auto}
nav a{padding:12px 0;color:var(--mu);text-decoration:none;white-space:nowrap;font-weight:500}
nav a.on{color:var(--tx);font-weight:700;box-shadow:inset 0 -3px var(--pr)}
main{max-width:860px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px;font-size:14px}
.item{display:grid;grid-template-columns:120px 1fr;gap:20px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px}
.item img{width:120px;height:auto;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.item h2{font-size:17px;margin:0 0 6px;line-height:1.35}
dl{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;margin:0;font-size:14px}dt{color:var(--mu)}dd{margin:0}
.price{font-weight:900;color:var(--sale);font-size:18px}.price s{color:var(--mu);font-weight:400;font-size:13px;margin-right:6px}
.note{font-size:12.5px;color:var(--mu);margin:10px 0 0;padding:0;list-style:none}
.buy{margin-top:12px;background:var(--pr);color:var(--pt);border:0;border-radius:6px;padding:10px 26px;font:inherit;font-weight:700;cursor:pointer}
.buy:disabled{background:var(--bd);color:var(--mu);cursor:default}
.buy:focus-visible,.cartbtn:focus-visible,nav a:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
aside{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--sf);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .25s;z-index:10;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
aside.open{transform:none}
aside h3{margin:0 0 14px;display:flex;justify-content:space-between}
aside h3 button{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer}
#list{flex:1;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row button{background:none;border:0;color:var(--mu);cursor:pointer;text-decoration:underline;font:inherit;font-size:12px}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:14px 0}
.empty{color:var(--mu);padding:20px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
.toast.show{opacity:1}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 20px 30px}
@media(max-width:520px){.item{grid-template-columns:90px 1fr;gap:14px}.item img{width:90px}}
[hidden]{display:none!important}
.lbox{max-width:380px;margin:40px auto;padding:28px 24px;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.lbox .logo{text-align:center}.lsub{text-align:center;color:var(--mu);font-size:14px;margin:6px 0 20px}
.lbox label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.lbox input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.lbox input:focus-visible{outline:3px solid var(--pr);outline-offset:1px}
.err{color:var(--sale);font-size:13px;font-weight:500;margin:12px 0 0}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){aside,.toast{transition:none}}
</style></head><body>

<nav><a href="#">강의계획</a><a href="#">강좌신청</a><a href="#" class="on">교재목록</a><a href="#">샘플/무료특강</a></nav>

const cart=new Set(),$=s=>document.getElementById(s),w=n=>n.toLocaleString("ko-KR")+"원";
let tt;function toast(m){const t=$("ts");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
$("books").innerHTML=BOOKS.map((b,i)=>`<article class="item"><img src="${b.img}" alt="${b.t} 표지"><div><h2>${b.t}</h2><dl><dt>저자</dt><dd>민정선 편저</dd><dt>도서상태</dt><dd>판매중</dd><dt>판매가</dt><dd class="price"><s>${w(b.p)}</s>${w(b.p)}</dd></dl><ul class="note"><li>출간월 : 26년 11월</li><li>ID당 1권만 구매 가능한 교재입니다.</li></ul><button class="buy" id="b${i}" data-i="${i}">장바구니 담기</button></div></article>`).join("");
function render(){const a=[...cart];$("cnt").textContent=a.length;$("list").innerHTML=a.length?a.map(i=>`<div class="row"><span>${BOOKS[i].t}</span><span>${w(BOOKS[i].p)}<br><button data-r="${i}">삭제</button></span></div>`).join(""):'<p class="empty">담긴 교재가 없습니다. 교재목록에서 담아보세요.</p>';
$("sum").textContent=w(a.reduce((s,i)=>s+BOOKS[i].p,0));BOOKS.forEach((_,i)=>{const b=$("b"+i);b.disabled=cart.has(i);b.textContent=cart.has(i)?"담김":"장바구니 담기"})}
document.addEventListener("click",e=>{const t=e.target;
if(t.dataset.i!==undefined){cart.add(+t.dataset.i);render();toast("장바구니에 담았습니다")}
if(t.dataset.r!==undefined){cart.delete(+t.dataset.r);render()}});
$("cb").onclick=()=>$("ac").classList.add("open");$("cl").onclick=()=>$("ac").classList.remove("open");
$("pay").onclick=()=>{if(!cart.size)return toast("먼저 교재를 담아주세요");$("ac").classList.remove("open");location.hash="login"};
function route(){const l=location.hash==="#login";$("login").hidden=!l;document.querySelector("main").hidden=l;document.querySelector("nav").hidden=l;$("err").hidden=true;if(l)$("uid").focus()}
addEventListener("hashchange",route);
$("lf").onsubmit=e=>{e.preventDefault();const m=$("err");m.textContent="로그인 오류";m.hidden=false;$("upw").value="";setTimeout(()=>{$("uid").value="";location.hash=""},1200)};
render();route();
</script></body></html>
